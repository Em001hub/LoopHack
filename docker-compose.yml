version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INTEGRATION_SERVICE_URL=http://integration-service:8000
      - CORE_SERVICE_URL=http://core-service:3001
      - INTELLIGENCE_SERVICE_URL=http://intelligence-service:8001
      - REALTIME_SERVICE_URL=http://realtime-service:3002
    depends_on:
      - integration-service

  integration-service:
    build: ./services/integration-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/projectmind
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=projectmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
