version: '3.8'

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - redis
      - integration-service
      - intelligence-service
      - core-service

  integration-service:
    build: ./services/integration-service
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  intelligence-service:
    build: ./services/intelligence-service
    ports:
      - "8002:8000"
    environment:
      - PORT=8000

  core-service:
    build: ./services/core-service
    ports:
      - "8003:3000"
    environment:
      - PORT=3000
    depends_on:
      - postgres

  realtime-service:
    build: ./services/realtime-service
    ports:
      - "8004:3000"
    environment:
      - PORT=3000
    depends_on:
      - redis

  notification-service:
    build: ./services/notification-service
    ports:
      - "8005:3000"
    environment:
      - PORT=3000
    depends_on:
      - redis
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loophack
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
