# pytest configuration for Intelligence Service ML/AI tests

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src/ml
    --cov=src/simulation
    --cov=src/services
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=55

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    slow: Slow-running tests (Monte Carlo with high n_simulations)
    ml: Machine learning model tests
    nlp: Natural language processing tests
    api: API endpoint tests
    
# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (5 minutes)
timeout = 300

# Asyncio mode
asyncio_mode = auto
